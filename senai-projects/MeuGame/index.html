<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meu Jogo de Plataforma</title>
    <style>
        body{
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #2c3e50;
            color: white;
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 20;
        }
        canvas{
            background-color: #87CEEB;
            border: 4px solid #fff;
            border-radius: 8px;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
        }
        p{
            font-size: 1.2rem;
            color: #ecf0f1;
        }
    </style>
</head>
<body>
    <h1>Meu Jogo de Plataforma</h1>
    <p>Use as <b>Setas (Esquerda/Direita)</b> para mover e a <b>Seta para Cima (ou Espaco)</b> para pular.</p>
    <canvas id="gameCanvas" width="800" height="400"></canvas>
    <script>
        const canvas = document.getElementById("gameCanvas");
        const ctx = canvas.getContext("2d");
        const gravity = 0.6;
        const player = {
            x:50,
            y:300,
            width: 30,
            height: 30,
            speed: 5,
            dx: 0,
            dy: 0,
            jumpPower: -12,
            isGrounded: false
        };
        const keys = {right: false, left: false};
        document.addEventListener("keydown", (event)=>{
            if(event.code === "ArrowRight") keys.right = true;
            if(event.code === "ArrowLeft") keys.left = true;
            if((event.code === "ArrowUp" || event.code === "Space") && player.isGrounded){
                player.dy = player.jumpPower;
                player.isGrounded = false;
            }
        });
        document.addEventListener("keyup", (event)=>{
            if(event.code === "ArrowRight") keys.right = false;
            if(event.code === "ArrowLeft") keys.left = false;
        });
        const platforms = [
            {x: 0, y:380, width:800, height:20},
            {x: 200, y:300, width:120, height:15},
            {x: 400, y:220, width:120, height:15},
            {x: 600, y:140, width:120, height:15}
        ];
        function update(){
            if(keys.right) player.dx = player.speed;
            else if(keys.left) player.dx = -player.speed;
            else player.dx = 0;
            player.dy += gravity;
            player.x += player.dx;
            player.y += player.dy;
            if(player.x < 0 ) player.x = 0;
            if(player.x + player.width > canvas.width) player.x = canvas.width - player.width;
            player.isGrounded = false;
            for(let i = 0; i < platforms.length; i++){
                let p = platforms[i];
                if(player.x < p.x + p.width &&
                    player.x + player.width > p.x &&
                    player.y + player.height > p.y &&
                    player.y + player.height < p.y + p.height + player.dy) {
                        if(player.dy > 0){
                            player.isGrounded = true;
                            player.dy = 0;
                            player.y = p.y - player.height;
                        }
                    }
            }
            if(player.y > canvas.height){
                player.x = 50;
                player.y = 300;
                player.dy = 0;

            }
        }
        function draw(){
            ctx.clearRect(0,0, canvas.width, canvas.height);
            ctx.fillStyle = "#8B4513";
            for(let i = 0; i < platforms.length; i++){
                let p = platforms[i];
                ctx.fillRect(p.x, p.y, p.width, p.height);
            }
            ctx.fillStyle = "#e74c3c";
            ctx.fillRect(player.x, player.y, player.width, player.height);
        }
        function gameLoop(){
            update();
            draw();
            requestAnimationFrame(gameLoop);
        }
        gameLoop();
    </script>
</body>
</html>
