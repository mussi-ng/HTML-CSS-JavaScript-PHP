<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Spotify</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo">🎵 Spotify</div>
            <nav class="menu">
                <a href="#" class="menu-item ativo">🏠 Início</a>
                <a href="#" class="menu-item">🔍 Buscar</a>
                <a href="#" class="menu-item">📚 Sua Biblioteca</a>
            </nav>
        </aside>

        <!-- Conteúdo Principal -->
        <main class="main">
            <!-- Player Topo -->
            <header class="header">
                <h1>Minhas Músicas</h1>
            </header>

            <!-- Lista de Músicas -->
            <section class="playlist">
                <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
                    <div class="musica-info">
                        <h3>Música 1</h3>
                        <p>Artista Desconhecido</p>
                    </div>
                    <button class="btn-play">▶️</button>
                </div>

                <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
                    <div class="musica-info">
                        <h3>Música 2</h3>
                        <p>Artista Desconhecido</p>
                    </div>
                    <button class="btn-play">▶️</button>
                </div>

                <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
                    <div class="musica-info">
                        <h3>Música 3</h3>
                        <p>Artista Desconhecido</p>
                    </div>
                    <button class="btn-play">▶️</button>
                </div>
            </section>
        </main>
    </div>

    <!-- Player Global -->
    <footer class="player">
        <div class="player-info">
            <p id="musica-titulo">Nenhuma música selecionada</p>
        </div>

        <div class="player-controles">
            <button id="btn-anterior">⏮️</button>
            <button id="btn-play-pause">▶️</button>
            <button id="btn-proximo">⏭️</button>
        </div>

        <div class="player-progresso">
            <span id="tempo-atual">0:00</span>
            <input type="range" id="barra-progresso" min="0" max="100" value="0">
            <span id="tempo-total">0:00</span>
        </div>

        <audio id="audio-player"></audio>
    </footer>

    <script src="script.js"></script>
</body>
</html>
