<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Spotify</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <div class="container">
    <!-- Sidebar (menu lateral) -->
    <aside class="sidebar">
      <div class="logo">🎵 Spotify</div>

      <nav class="menu" aria-label="Menu principal">
        <a href="#" class="menu-item ativo">🏠 Início</a>
        <a href="#" class="menu-item">🔍 Buscar</a>
        <a href="#" class="menu-item">📚 Sua Biblioteca</a>
      </nav>
    </aside>

    <!-- Conteúdo principal da página -->
    <main class="main">
      <!-- Cabeçalho da lista -->
      <header class="header">
        <h1>Minhas Músicas</h1>
      </header>

      <!-- Lista de músicas (cada card define um mp3 via data-src) -->
      <section class="playlist" aria-label="Lista de músicas">
        <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-1.mp3">
          <div class="musica-info">
            <h3>Música 1</h3>
            <p>Artista Desconhecido</p>
          </div>
          <button class="btn-play" type="button" aria-label="Tocar Música 1">▶️</button>
        </div>

        <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-2.mp3">
          <div class="musica-info">
            <h3>Música 2</h3>
            <p>Artista Desconhecido</p>
          </div>
          <button class="btn-play" type="button" aria-label="Tocar Música 2">▶️</button>
        </div>

        <div class="musica-card" data-src="https://www.soundhelix.com/examples/mp3/SoundHelix-Song-3.mp3">
          <div class="musica-info">
            <h3>Música 3</h3>
            <p>Artista Desconhecido</p>
          </div>
          <button class="btn-play" type="button" aria-label="Tocar Música 3">▶️</button>
        </div>
      </section>
    </main>
  </div>

  <!-- Player global (barra, botões e áudio) -->
  <footer class="player">
    <div class="player-info">
      <p id="musica-titulo">Nenhuma música selecionada</p>
    </div>

    <div class="player-controles" aria-label="Controles do player">
      <button id="btn-anterior" type="button" aria-label="Música anterior">⏮️</button>
      <button id="btn-play-pause" type="button" aria-label="Tocar ou pausar">▶️</button>
      <button id="btn-proximo" type="button" aria-label="Próxima música">⏭️</button>
    </div>

    <div class="player-progresso">
      <span id="tempo-atual">0:00</span>
      <input type="range" id="barra-progresso" min="0" max="100" value="0" aria-label="Progresso da música">
      <span id="tempo-total">0:00</span>
    </div>

    <!-- Elemento de áudio controlado pelo script.js -->
    <audio id="audio-player"></audio>
  </footer>

  <script src="script.js"></script>
</body>
</html>
