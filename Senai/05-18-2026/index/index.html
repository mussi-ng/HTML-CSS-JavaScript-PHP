<!-- =========================================================
	index.html
	- Página de inscrição/cadastro (HTML estático)
	- Apenas campos de formulário (sem backend)
========================================================= -->
<html>
	<head>
		<title>Inscreva-se</title>
		<meta charset="UTF-8">
	</head>

	<body>
		<h1>Inscreva-se no nosso site!</h1>
		<h2>Insira suas informações abaixo:</h2>

		<!-- Formulário estático: sem action/método -->
		<form>
			<!-- Dados pessoais -->
			Nome: <input type="text" id="nome"><br><br>
			Sobrenome: <input type="text" id="sobrenome"><br><br>

			<!-- Gênero -->
			Genero: <br>
			Masculino <input type="radio" id="m"><br>
			Feminino <input type="radio" id="f"><br>
			Outro (Informar): <input type="text" id="o"><br>

			<!-- Status -->
			Status: <br>
			Estudante <input type="checkbox" id="">Sim<input type="checkbox" id="">Não<br>
			Empregado <input type="checkbox" name="sim" id=""><br>
			Prefiro nao <input type="checkbox" id=""><br>

			<!-- Contato -->
			E-mail: <input type="text" id="email"><br><br>
			<hr>

			<!-- Credenciais -->
			Crie um usuario: <input type="text" id="usuario"><br><br>
			Crie uma senha: <input type="password" id="senha"><br><br>
			Confirme a senha: <input type="password" id="senha_confirmar"><br><br>

			<input type="button" value="Confirmar"><br>
			<input type="checkbox" name="sim" id="">
		</form>
	</body>
</html>
