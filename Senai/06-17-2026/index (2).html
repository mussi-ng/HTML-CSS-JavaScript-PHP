<!DOCTYPE html>
<html lang="pt">
<head>
    <meta charset="UTF-8">
    <title>Loja Escolar</title>
    <style>
        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }
        
        body{
            font-family:sans-serif;
            background:#000000;
            color:#bd9410;
        }

        header{
            background:#000000;
            color:#bd9410;
            padding:1rem;
            display:flex;
            justify-content:space-between;
        }
        nav a{
            color:#bd9410;
            margin-left:1rem;
            text-decoration:none;
        }

        .secao{
            display:none;
            padding:1rem;
        }
        
        .secao.ativa{
            display:block;
        }

        .produtos{
            display:grid;
            grid-template-columns:repeat(auto-fill,minmax(200px,1fr));
            gap:1rem;
            margin-top:1rem;
        }

        .card{
            background:#202020;
            padding:1rem;
            border-radius:8px;
            text-align:center;
        }

        .card img{
            max-width:100%;
            height:120px;
            object-fit:contain;
        }

        .preco{
            color:#202020;
            font-weight:bold;
            font-size:1.2rem;
        }

        button{
            background:#6b6b6b;
            color:#000000;
            border:none;
            padding:.5rem 1rem;
            border-radius:4px;
            cursor:pointer;

        }

        .carrinho-item{
            display:flex;
            justify-content:space-between;
            align-items:center;
            padding:.5rem 0;
            border-bottom:1px solid #bd9410;
        }

        table{
            width:100%;
            border-collapse:collapse;
        }

        td,th{
            padding:.5rem;
            border:1px solid #bd9410;
        }

        .admin-login{
            margin-bottom:1rem;
        }
    </style>
</head>
<body>
    <header>
        <h2>📚 Loja Escolar</h2>
        <nav>
            <a href="#" onclick="mostrar('vitrine')">Início</a>
            <a href="#" onclick="mostrar('carrinho')">🛒<span id="cont">0</span></a>
            <a href="#" onclick="mostrar('admin')">Admin</a>
        </nav>
    </header>

    <!-- Vitrine -->
    <div id="vitrine" class="secao ativa">
        <div id="filtros" style="margin-bottom:1rem"></div>
        <div class="produtos" id="lista-produtos"></div>
    </div>

    <!-- Carrinho -->
    <div id="carrinho" class="secao">
        <h3>Carrinho</h3>
        <div id="itens-carrinho"></div>
        <p id="total" style="text-align:right;font-weight:bold"></p>
        <button onclick="finalizar()">Finalizar Compra</button>
    </div>

    <!-- Admin -->
    <div id="admin" class="secao">
        <h3>Administração</h3>
        <div class="admin-login">
            <input type="password" id="senha" placeholder="Senha (admin123)">
            <button onclick="login()">Entrar</button>
            <p id="msg"></p>
        </div>
        <div id="painel" style="display:none">
            <h4>Adicionar Produto</h4>
            <input id="nome" placeholder="Nome"><br>
            <input id="desc" placeholder="Descrição"><br>
            <input id="preco" type="number" step="0.01" placeholder="Preço"><br>
            <input id="img" placeholder="Imagem (ex: foto.jpg)"><br>
            <button onclick="addProduto()">Salvar</button>
            <hr>
            <table id="tabela"><tr><th>Nome</th><th>Preço</th><th>Excluir</th></tr></table>
            <button onclick="logout()">Sair</button>
        </div>
    </div>

    <script>
        // Produtos iniciais (se não houver nada salvo)
        const padrao = [
            {id:1, nome:'Caderno', desc:'10 matérias', preco:25.9, img:'caderno.jpg'},
            {id:2, nome:'Lápis HB', desc:'Caixa c/ 12', preco:8.5, img:'lapis.jpg'},
            {id:3, nome:'Mochila', desc:'Resistente', preco:119.9, img:'mochila.jpg'}
        ];
        let produtos = JSON.parse(localStorage.getItem('produtos')) || padrao;
        let carrinho = JSON.parse(localStorage.getItem('carrinho')) || [];
        let adminOn = false;

        // Mostrar seções
        function mostrar(id) {
            document.querySelectorAll('.secao').forEach(s => s.classList.remove('ativa'));
            document.getElementById(id).classList.add('ativa');
            if (id === 'vitrine') renderVitrine();
            if (id === 'carrinho') renderCarrinho();
            atualizarContador();
        }

        // Vitrine
        function renderVitrine() {
            let html = '<button onclick="filtrar(\'todas\')">Todas</button>';
            let cats = [...new Set(produtos.map(p => p.nome.split(' ')[0]))]; 
            cats.forEach(c => html += `<button onclick="filtrar('${c}')">${c}</button>`);
            document.getElementById('filtros').innerHTML = html;
            filtrar('todas');
        }
        function filtrar(cat) {
            let lista = cat === 'todas' ? produtos : produtos.filter(p => p.nome.startsWith(cat));
            let html = '';
            lista.forEach(p => {
                html += `<div class="card">
                    <img src="imagens/${p.img}" onerror="this.src='https://via.placeholder.com/120'">
                    <h4>${p.nome}</h4><p>${p.desc}</p>
                    <p class="preco">R$ ${p.preco.toFixed(2)}</p>
                    <button onclick="addCarrinho(${p.id})">Adicionar</button>
                </div>`;
            });
            document.getElementById('lista-produtos').innerHTML = html || '<p>Nenhum produto.</p>';
        }

        // Carrinho
        function addCarrinho(id) {
            let item = carrinho.find(i => i.id === id);
            if (item) item.qtd++; else carrinho.push({id, qtd:1});
            salvarCarrinho();
            atualizarContador();
        }
        function renderCarrinho() {
            let html = '', total = 0;
            carrinho.forEach(item => {
                let p = produtos.find(prod => prod.id === item.id);
                if (!p) return;
                let sub = p.preco * item.qtd;
                total += sub;
                html += `<div class="carrinho-item">
                    <span>${p.nome} (x${item.qtd})</span>
                    <span>R$ ${sub.toFixed(2)}</span>
                    <button onclick="removerItem(${item.id})">X</button>
                </div>`;
            });
            document.getElementById('itens-carrinho').innerHTML = html || '<p>Carrinho vazio.</p>';
            document.getElementById('total').textContent = 'Total: R$ ' + total.toFixed(2);
        }
        function removerItem(id) {
            carrinho = carrinho.filter(i => i.id !== id);
            salvarCarrinho();
            renderCarrinho();
            atualizarContador();
        }
        function finalizar() {
            if (!carrinho.length) return alert('Carrinho vazio!');
            alert('Compra finalizada! Obrigado.');
            carrinho = [];
            salvarCarrinho();
            mostrar('vitrine');
        }

        // Admin
        function login() {
            if (document.getElementById('senha').value === 'admin123') {
                adminOn = true;
                document.querySelector('.admin-login').style.display = 'none';
                document.getElementById('painel').style.display = 'block';
                renderAdminTabela();
            } else document.getElementById('msg').textContent = 'Senha incorreta!';
        }
        function logout() {
            adminOn = false;
            document.querySelector('.admin-login').style.display = 'block';
            document.getElementById('painel').style.display = 'none';
        }
        function addProduto() {
            let nome = document.getElementById('nome').value;
            let preco = parseFloat(document.getElementById('preco').value);
            if (!nome || isNaN(preco)) return alert('Preencha nome e preço!');
            produtos.push({
                id: Date.now(),
                nome,
                desc: document.getElementById('desc').value,
                preco,
                img: document.getElementById('img').value || 'sem-foto.jpg'
            });
            salvarProdutos();
            renderAdminTabela();
            // limpar campos
            ['nome','desc','preco','img'].forEach(id => document.getElementById(id).value = '');
        }
        function excluir(id) {
            produtos = produtos.filter(p => p.id !== id);
            carrinho = carrinho.filter(i => i.id !== id); // remove do carrinho também
            salvarProdutos();
            salvarCarrinho();
            renderAdminTabela();
            renderVitrine();
        }
        function renderAdminTabela() {
            let tbody = document.querySelector('#tabela');
            tbody.innerHTML = '<tr><th>Nome</th><th>Preço</th><th>Excluir</th></tr>';
            produtos.forEach(p => {
                let row = tbody.insertRow();
                row.innerHTML = `<td>${p.nome}</td><td>R$ ${p.preco.toFixed(2)}</td>
                <td><button onclick="excluir(${p.id})">X</button></td>`;
            });
        }

        // Persistência
        function salvarProdutos() { localStorage.setItem('produtos', JSON.stringify(produtos)); }
        function salvarCarrinho() { localStorage.setItem('carrinho', JSON.stringify(carrinho)); }
        function atualizarContador() {
            document.getElementById('cont').textContent = carrinho.reduce((t, i) => t + i.qtd, 0);
        }

        // Inicialização
        renderVitrine();
        atualizarContador();
    </script>
</body>
</html>
