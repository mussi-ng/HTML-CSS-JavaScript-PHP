<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Geek Game Hub</title>
    <style>
        body{
            background: #000000;
            color: rgb(105, 72, 223);
            font-family: 'Courier New', Courier, monospace;
            text-align: center;
            margin: 0;
            padding: 15px;
        }
        h1{
            text-shadow: 0 0 10px rgb(105, 78, 228);
        }
        .container{
            display: flex;
            flex-wrap: wrap;
            gap: 15px;
            justify-content: center;
            max-width: 1000px;
            margin: 0 auto;
        }
        .janela{
            border: 2px solid rgb(105, 78, 228);
            border-radius: 10px;
            overflow: hidden;
            flex: 1 1 400px;
            max-width: 500px;
            box-shadow: 0 0 15px rgb(105, 78, 228);
        }
        iframe{
            width: 100%;
            height: 400px;
            border: none;
            background: #000;
        }
        .botoes{
            background: #111;
            padding: 8px;
            border-top: 1px solid rgb(105, 78, 228);
        }
        button{
            background: rgb(105, 78, 228);
            color: #000;
            border: none;
            padding: 6px 12px;
            border-radius: 4px;
            cursor: pointer;
            font-family: inherit;
            font-weight: bold;
            margin: 2px;
            font-size: 0.8rem;
        }
        button:hover{
            background: #c95926;
            box-shadow: 0 0 10px rgb(105, 78, 228);
        }
        .controles{
            margin-top: 20px;
        }
    </style>
</head>
<body>
    <h1>🕹 GEEK GAME HUB</h1>
    <p>Jogos incorporados em HTML</p>
    <div class="container">
        <div class="janela">
            <iframe id="jogo1" src="https://funhtml5games.com?embed=pacman"
            style="width: 480px; height: 510px; border: none;" frameborder="0" scrolling="no"></iframe>
            <div class="botoes">
                <button onclick="telaCheia(1)">🔎 Tela Cheia</button>
                <button onclick="recarregar(1)">🔄 Recarregar</button>
            </div>
        </div>
        <div class="janela">
            <iframe id="jogo2" src="https://funhtml5games.com?embed=blockescape"
            style="width: 480px; height: 510px; border: none;" frameborder="0" scrolling="no"></iframe>
            <div class="botoes">
                <button onclick="telaCheia(2)">🔎 Tela Cheia</button>
                <button onclick="recarregar(2)">🔄 Recarregar</button>
            </div>
        </div>
        <div class="janela">
            <iframe id="jogo3" src="https://funhtml5games.com/?play=bomberman"
            style="width: 480px; height: 510px; border: none;" frameborder="0" scrolling="no"></iframe>
            <div class="botoes">
                <button onclick="telaCheia(3)">🔎 Tela Cheia</button>
                <button onclick="recarregar(3)">🔄 Recarregar</button>
            </div>
        </div>
        <div class="janela">
            <iframe id="jogo4" src="https://funhtml5games.com/?embed=retroracer"
            style="width: 480px; height: 510px; border: none;" frameborder="0" scrolling="no"></iframe>
            <div class="botoes">
                <button onclick="telaCheia(4)">🔎 Tela Cheia</button>
                <button onclick="recarregar(4)">🔄 Recarregar</button>
            </div>
        </div>
    </div>
    <div class="controles">
        <button onclick="recarregarTudo()">🔄 Recarregar Todos</button>
        <button onclick="trocarJogos()">🔁 Trocar Jogo 1 e 2</button>
    </div>
    <script>
        function recarregar(num){
            const iframe = document.getElementById('jogo' + num);
            const src = iframe.src;
            iframe.src = '';
            setTimeout(()=> { iframe.src = src; }, 100);
        }
        function telaCheia(num){
            const iframe = document.getElementById('jogo' + num);
            if(iframe.requestFullscreen){
                iframe.requestFullscreen().catch(()=> window.open(iframe.src, '_blank'));
            } else {
                window.open(iframe.src, '_blank');
            }
        }
        function trocarJogos(){
            const jogo1 = document.getElementById('jogo1');
            const jogo2 = document.getElementById('jogo2');
            const tempSrc = jogo1.src;
            jogo1.src = jogo2.src;
            jogo2.src = tempSrc;
        }
        function recarregarTudo(){
            for(let i = 1; i <= 4; i++){
                setTimeout(()=> recarregar(i), i * 150);
            }
        }
    </script>
</body>
</html>
